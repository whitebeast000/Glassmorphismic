<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid; place-items: center; height: 100vh; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;background: linear-gradient(135deg, rgb(31, 124, 124) -40%, rgb(2, 32, 32) 100%) ;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        input{
            background:none;
                 color: #fff;
                 font-size: 18px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            -webkit-box-shadow: 0 0 0px 1000px inset transparent;
            transition: background-color 5000s ease-in-out 0s;
        }

   
        input:focus-visible{
            border: none;
            outline: none;
            color: #fff;
        }
        .login-card { 
    background: rgba(255, 255, 255, 0.08); 
    backdrop-filter: blur(12px);             
    
    -webkit-backdrop-filter: blur(12px);     
    border: 0.1px solid rgba(255, 255, 255, 0.5); 
    border-radius: 16px;                    
    padding: 40px;
    width: 380px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
    color: #fff;                             
        }

        button{
            background: linear-gradient(135deg , rgb(10, 119, 119) 0% , rgb(4, 61, 61) 100%);
            color: #fff;

            border: 2px solid rgba(255,255,255,0.41);
            font-weight: bolder;
            width: 100%;
            padding: 12px 16px; 
            box-shadow: 0px 10px 22px 0px rgba(0, 0, 0, 0.37); 
            margin: 20px 0;
            border-radius: 6px;

        }
        button:hover{
            background: linear-gradient(135deg ,  rgb(4, 61, 61) 0% , rgb(10, 119, 119) 100%);
        }
      
        a,a:nth-child(1){
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        a{
            color: grey;
        }
    </style>
</head>
<body >
    
    <div  class="login-card" style="display: flex; flex-direction: column; padding: 30px; width: 25%;">
        <h1 style="text-align: center; font-family: monospace; font-size: 44px; font-weight: bolder;">Register</h1>
        <form action="login.html" >
            <input style="border: none; margin-bottom:-50px ;" type="text" id="username" placeholder="Enter your username" required >
            <hr  style="margin-bottom: 10px;" >
            <input style="border: none; margin: 10px 0 -50px ;" type="text" id="email" placeholder="Enter your email" required >
            <hr  style="margin-bottom: 10px;" >
            <input style="border: none; margin-top: 10px; margin-bottom:-50px ;" type="password" id="password" placeholder="Enter your password" required >
            <hr style="margin-bottom: 30px;" >

            

            <button type="submit">Register</button>

            <p style="text-align: center;  color: grey;" >Already Registered |<a href="login.html"> Login..</a></p>

        </form>
    </div>
</body>
</html>
